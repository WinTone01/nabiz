<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Nabız — internet stability, measured all the way down">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5fdf90"/>
      <stop offset="50%"  stop-color="#61d4ec"/>
      <stop offset="100%" stop-color="#b79cff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#b79cff"/>
      <stop offset="100%" stop-color="#61d4ec"/>
    </linearGradient>
  </defs>

  <text x="40" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="64" font-weight="700" fill="url(#ink)" letter-spacing="-1">Nabız</text>

  <text x="44" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="14" fill="#8b8ba4">internet stability, measured all the way down</text>

  <!-- the trace: steady, one spike, one dropout, steady again -->
  <path d="M40 168 H150 l14 -30 12 30 H300" fill="none" stroke="url(#pulse)"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 168 h30" fill="none" stroke="#ff7378" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M330 168 H470 l16 -44 14 44 H720" fill="none" stroke="url(#pulse)"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="486" cy="124" r="5.5" fill="#b79cff"/>
  <circle cx="315" cy="168" r="4.5" fill="#ff7378"/>
</svg>
