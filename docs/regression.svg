<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Telling a driver regression from a broken cable">
  <style>
    .t { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    .h { font-size: 15px; font-weight: 700; }
    .k { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; fill: #8b8ba4; }
    .s { font-size: 11px; fill: #6f6f82; }
  </style>

  <text class="t h" x="24" y="30" fill="#61d4ec">The kernel says "check cabling!" — is it the cable?</text>
  <text class="t s" x="24" y="52">A counter tells you the link dropped. Only history tells you whether that is new.</text>

  <!-- reboot divider, drawn between the cards and clear of both -->
  <text class="t s" x="418" y="86" fill="#b79cff">reboot</text>
  <line x1="450" y1="94" x2="450" y2="256" stroke="#b79cff" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- old kernel -->
  <rect x="24" y="98" width="400" height="130" rx="10" fill="none" stroke="#5fdf90" stroke-width="1.5"/>
  <text class="t k" x="46" y="126" fill="#5fdf90">7.1.8</text>
  <text class="t b" x="46" y="150">13 boots · 214 h uptime</text>
  <text class="t b" x="46" y="170">0 drops in every retained log window</text>
  <text class="t s" x="46" y="196">link</text>
  <line x1="86" y1="192" x2="402" y2="192" stroke="#5fdf90" stroke-width="4" stroke-linecap="round"/>
  <text class="t s" x="46" y="216">steady for days at a time</text>

  <!-- new kernel -->
  <rect x="476" y="98" width="400" height="130" rx="10" fill="none" stroke="#ff7378" stroke-width="1.5"/>
  <text class="t k" x="498" y="126" fill="#ff7378">7.2.0</text>
  <text class="t b" x="498" y="150">3 boots · 8 h uptime</text>
  <text class="t b" x="498" y="170">105 drops — one every four minutes</text>
  <text class="t s" x="498" y="196">link</text>
  <g stroke="#ff7378" stroke-width="4" stroke-linecap="round">
    <line x1="538" y1="192" x2="566" y2="192"/><line x1="580" y1="192" x2="604" y2="192"/>
    <line x1="618" y1="192" x2="648" y2="192"/><line x1="662" y1="192" x2="686" y2="192"/>
    <line x1="700" y1="192" x2="732" y2="192"/><line x1="746" y1="192" x2="770" y2="192"/>
    <line x1="784" y1="192" x2="812" y2="192"/><line x1="826" y1="192" x2="854" y2="192"/>
  </g>
  <text class="t s" x="498" y="216">gaps are outages</text>

  <text class="t s" x="24" y="252">same cable · same modem · same settings</text>

  <!-- verdict -->
  <rect x="24" y="272" width="852" height="128" rx="10" fill="none" stroke="#32324a" stroke-width="1.5"/>
  <text class="t h" x="46" y="302" fill="#b79cff">Why the counter alone is not enough</text>
  <text class="t b" x="46" y="330">Boot times and kernel versions come from <tspan fill="#61d4ec">wtmp</tspan>, which survives journal rotation.</text>
  <text class="t b" x="46" y="354">Drop counts come from the kernel log, so old boots read "no coverage" — never a silent zero.</text>
  <text class="t b" x="46" y="378">214 quiet hours next to 13 drops an hour is a <tspan fill="#ff7378" font-weight="700">regression</tspan>, not a cable.</text>
</svg>
