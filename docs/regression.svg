<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Telling a driver regression from a broken cable">
  <style>
    .t { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 12.5px; fill: #8b8ba4; }
    .s { font-size: 11.5px; fill: #6f6f82; }
    .k { font-size: 13px; font-weight: 700; }
  </style>

  <text class="t h" x="24" y="30" fill="#61d4ec">The kernel says “check cabling!” — is it the cable?</text>
  <text class="t s" x="24" y="52">A counter tells you the link dropped. Only history tells you whether that is new.</text>

  <!-- timeline axis -->
  <line x1="60" y1="150" x2="840" y2="150" stroke="#32324a" stroke-width="1.5"/>

  <!-- old kernel: quiet -->
  <rect x="60" y="118" width="420" height="64" rx="9" fill="none" stroke="#5fdf90" stroke-width="1.5"/>
  <text class="t k" x="78" y="140" fill="#5fdf90">7.1.8</text>
  <text class="t b" x="78" y="162">13 boots · 214 h uptime · 0 drops</text>
  <line x1="60" y1="150" x2="480" y2="150" stroke="#5fdf90" stroke-width="3"/>

  <!-- upgrade marker -->
  <line x1="480" y1="96" x2="480" y2="204" stroke="#b79cff" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="t k" x="452" y="90" fill="#b79cff">reboot</text>

  <!-- new kernel: flapping -->
  <rect x="480" y="118" width="360" height="64" rx="9" fill="none" stroke="#ff7378" stroke-width="1.5"/>
  <text class="t k" x="498" y="140" fill="#ff7378">7.2.0</text>
  <text class="t b" x="498" y="162">3 boots · 8 h uptime · 105 drops</text>
  <g stroke="#ff7378" stroke-width="3">
    <line x1="490" y1="150" x2="520" y2="150"/><line x1="534" y1="150" x2="560" y2="150"/>
    <line x1="576" y1="150" x2="604" y2="150"/><line x1="620" y1="150" x2="646" y2="150"/>
    <line x1="662" y1="150" x2="694" y2="150"/><line x1="708" y1="150" x2="736" y2="150"/>
    <line x1="752" y1="150" x2="782" y2="150"/><line x1="796" y1="150" x2="836" y2="150"/>
  </g>

  <text class="t s" x="60" y="204">same cable · same modem · same settings</text>

  <!-- verdict -->
  <rect x="60" y="240" width="780" height="120" rx="10" fill="none" stroke="#32324a" stroke-width="1.5"/>
  <text class="t h" x="82" y="270" fill="#b79cff">Why the counter alone is not enough</text>
  <text class="t b" x="82" y="296">Boot times and kernel versions come from <tspan fill="#61d4ec">wtmp</tspan>, which survives journal rotation.</text>
  <text class="t b" x="82" y="318">Drop counts come from the kernel log, so old boots read “no coverage” — never a silent zero.</text>
  <text class="t b" x="82" y="342">214 quiet hours next to 13 drops an hour is a <tspan fill="#ff7378" font-weight="700">regression</tspan>, not a cable. Roll the package back.</text>
</svg>
