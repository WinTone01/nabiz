<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-label="Telling a driver regression from a broken cable">
  <rect width="1200" height="570" rx="22" fill="#14141c"/>
  <text x="40" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#61d4ec" font-weight="700">The kernel says "check cabling!" — is it the cable?</text>
  <text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a7a95">A counter tells you the link dropped. Only history tells you whether that is new.</text>
  <rect x="40" y="112" width="530" height="252" rx="14" fill="#1e1e2a" stroke="#33334a" stroke-width="2"/>
  <text x="68" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#5fdf90" font-weight="700">7.1.8</text>
  <text x="68" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">13 boots · 214 h uptime</text>
  <text x="68" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">0 drops in every retained log window</text>
  <text x="68" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a7a95">link</text>
  <rect x="126" y="262" width="400" height="12" rx="6" fill="#5fdf90"/>
  <text x="68" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a7a95">steady for days at a time</text>
  <rect x="630" y="112" width="530" height="252" rx="14" fill="#1e1e2a" stroke="#33334a" stroke-width="2"/>
  <text x="658" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#ff7378" font-weight="700">7.2.0</text>
  <text x="658" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">3 boots · 8 h uptime</text>
  <text x="658" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">105 drops — one every four minutes</text>
  <text x="658" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a7a95">link</text>
  <rect x="716" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="768" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="820" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="872" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="924" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="976" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="1028" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <rect x="1080" y="262" width="34" height="12" rx="6" fill="#ff7378"/>
  <text x="658" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a7a95">gaps are outages</text>
  <line x1="600" y1="120" x2="600" y2="356" stroke="#4a4a68" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 10"/>
  <text x="600" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a7a95" text-anchor="middle">reboot</text>
  <text x="600" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a7a95" text-anchor="middle">same cable · same modem · same settings</text>
  <rect x="40" y="414" width="1120" height="126" rx="14" fill="#1e1e2a" stroke="#33334a" stroke-width="2"/>
  <text x="70" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#b79cff" font-weight="700">Why the counter alone is not enough</text>
  <text x="70" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">Boot times and kernel versions come from wtmp, which survives journal rotation.</text>
  <text x="70" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">Drop counts come from the kernel log, so old boots read "no coverage" — never a silent zero.</text>
  <text x="70" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">214 quiet hours next to 13 drops an hour is a regression, not a cable.</text>
</svg>
