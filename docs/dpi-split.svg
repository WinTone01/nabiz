<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="Split ClientHello probing">
  <rect width="1200" height="450" rx="22" fill="#14141c"/>
  <text x="40" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#61d4ec" font-weight="700">Same request, three shapes — the failure tells you the block type</text>
  <text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a7a95">one packet, then two, then two cut through the hostname itself</text>
  <text x="40" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b79cff">whole</text>
  <rect x="190" y="118" width="400" height="46" rx="10" fill="#262636" stroke="#33334a" stroke-width="2"/>
  <text x="390.0" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b8b8cc" text-anchor="middle">ClientHello · SNI inside</text>
  <line x1="620" y1="141" x2="736" y2="141" stroke="#7a7a95" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9"/>
  <text x="756" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ff7378" font-weight="700">RST / silence</text>
  <text x="40" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b79cff">split@record</text>
  <rect x="190" y="194" width="96" height="46" rx="10" fill="#262636" stroke="#33334a" stroke-width="2"/>
  <text x="238.0" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b8b8cc" text-anchor="middle">hdr</text>
  <rect x="300" y="194" width="290" height="46" rx="10" fill="#262636" stroke="#33334a" stroke-width="2"/>
  <text x="445.0" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b8b8cc" text-anchor="middle">rest of the ClientHello</text>
  <line x1="620" y1="217" x2="736" y2="217" stroke="#7a7a95" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9"/>
  <text x="756" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5fdf90" font-weight="700">handshake completes</text>
  <text x="40" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b79cff">split@sni</text>
  <rect x="190" y="270" width="196" height="46" rx="10" fill="#262636" stroke="#33334a" stroke-width="2"/>
  <text x="288.0" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b8b8cc" text-anchor="middle">…exam</text>
  <rect x="398" y="270" width="192" height="46" rx="10" fill="#262636" stroke="#33334a" stroke-width="2"/>
  <text x="494.0" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#b8b8cc" text-anchor="middle">ple.com…</text>
  <line x1="620" y1="293" x2="736" y2="293" stroke="#7a7a95" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9"/>
  <text x="756" y="299" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5fdf90" font-weight="700">handshake completes</text>
  <rect x="40" y="342" width="1120" height="82" rx="14" fill="#1e1e2a" stroke="#33334a" stroke-width="2"/>
  <text x="70" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">Only the split versions get through, so the DPI matches SNI inside a single packet and never</text>
  <text x="70" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b8b8cc">reassembles the stream — what zapret's multisplit / multidisorder strategies address.</text>
</svg>
